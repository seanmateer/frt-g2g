<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRT G2G Import</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
    }

    .header {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header svg {
      width: 24px;
      height: 24px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .content {
      padding: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #6b7280;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state h2 {
      font-size: 14px;
      margin-bottom: 8px;
      color: #374151;
    }

    .empty-state p {
      font-size: 13px;
      line-height: 1.5;
    }

    .post-preview {
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 12px;
      margin-bottom: 16px;
    }

    .post-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .post-text {
      font-size: 13px;
      line-height: 1.5;
      color: #374151;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .analysis-section {
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 12px;
      margin-bottom: 16px;
    }

    .analysis-section h3 {
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .analysis-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      color: #6b7280;
      font-size: 13px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .parsed-data {
      display: grid;
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-group label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
    }

    .field-group select,
    .field-group input {
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: white;
    }

    .field-group select:focus,
    .field-group input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .status-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .status-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 2px solid #e5e7eb;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      background: white;
    }

    .status-option:hover {
      border-color: #d1d5db;
    }

    .status-option.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .status-option input {
      display: none;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status-dot.open { background: #22c55e; }
    .status-dot.muddy { background: #f59e0b; }
    .status-dot.snowy { background: #3b82f6; }
    .status-dot.closed { background: #ef4444; }

    .status-label {
      font-size: 12px;
      font-weight: 500;
    }

    .confidence-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .confidence-high { background: #dcfce7; color: #166534; }
    .confidence-medium { background: #fef3c7; color: #92400e; }
    .confidence-low { background: #fee2e2; color: #991b1b; }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-primary:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .success-message {
      text-align: center;
      padding: 24px;
    }

    .success-message svg {
      width: 48px;
      height: 48px;
      color: #22c55e;
      margin-bottom: 12px;
    }

    .success-message h2 {
      font-size: 16px;
      color: #166534;
      margin-bottom: 8px;
    }

    .success-message p {
      font-size: 13px;
      color: #6b7280;
    }

    .settings-link {
      display: block;
      text-align: center;
      padding: 12px;
      font-size: 12px;
      color: #6b7280;
      text-decoration: none;
      border-top: 1px solid #e5e7eb;
    }

    .settings-link:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
    <h1>FRT G2G Trail Import</h1>
  </div>

  <div class="content" id="content">
    <!-- Content will be injected by JavaScript -->
  </div>

  <a href="#" class="settings-link" id="settingsLink">Configure API Settings</a>

  <script src="src/popup.js"></script>
</body>
</html>
